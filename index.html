<script>

function getUser() {

  const savedUser =
    localStorage.getItem(
      "learnNovaUser"
    );

  if (!savedUser) {

    return null;

  }

  try {

    return JSON.parse(
      savedUser
    );

  }

  catch {

    return null;

  }

}


function updateUserName() {

  const user =
    getUser();

  if (
    user &&
    user.name
  ) {

    document
      .getElementById(
        "userName"
      )
      .innerText =
      user.name;

  }

}


updateUserName();


// =====================================
// ENROLL COURSE
// =====================================

async function enrollCourse(
  courseId,
  button
) {

  const originalText =
    button.innerText;


  try {

    const user =
      getUser();


    const customerName =
      user?.name ||
      prompt("Enter your name");


    const customerEmail =
      user?.email ||
      prompt("Enter your email");


    const customerPhone =
      user?.phone ||
      prompt(
        "Enter your 10 digit mobile number"
      );


    if (
      !customerName ||
      !customerEmail ||
      !customerPhone
    ) {

      alert(
        "Please enter all details."
      );

      return;

    }


    button.disabled =
      true;

    button.innerText =
      "Opening Payment...";


    const response =
      await fetch(

        "/create-payment-link",

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              courseId,

              customerName,

              customerEmail,

              customerPhone

            })

        }

      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Payment error"
      );

    }


    // Save link ID
    // Payment के बाद इसी से verify करेंगे

    localStorage.setItem(

      "learnNovaPendingPayment",

      data.linkId

    );


    button.innerText =
      "Redirecting to Payment...";


    window.location.href =
      data.paymentLink;

  }


  catch (error) {

    console.error(error);

    alert(
      error.message ||
      "Payment server error"
    );

  }


  finally {

    setTimeout(

      () => {

        button.disabled =
          false;

        button.innerText =
          originalText;

      },

      1500

    );

  }

}


// =====================================
// LOGOUT
// =====================================

function logout() {

  localStorage.removeItem(
    "learnNovaUser"
  );

  localStorage.removeItem(
    "learnNovaPendingPayment"
  );

  window.location.href =
    "/";

}

</script>
